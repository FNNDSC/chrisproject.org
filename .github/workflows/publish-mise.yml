# Publishes the npm packages of the mise monorepo (HARBOR-Medical-AI/mise).
#
# Why it lives here: npm trusted publishing exchanges the workflow's OIDC
# token for a publish token, matching the token's `sub` claim against each
# package's trusted publisher. mise moved to HARBOR-Medical-AI after GitHub's
# 2026-07-15 cutoff, so its tokens carry the immutable subject format
# (`repo:Owner@id/repo@id`), which npm's exchange does not accept yet
# (npm/cli#9969). This repository predates the cutoff and keeps the
# name-based subject, so a run here is accepted. Every @fnndsc package and
# bsd-trek names this repository and this workflow as its trusted publisher.
#
# No secret is involved: the run's OIDC token is the credential. Provenance
# is off because a provenance statement must name the repository that built
# the package, and package.json names HARBOR-Medical-AI/mise.
#
# Started by mise's `make publish` after a Version Packages merge, or by hand:
#   gh workflow run publish-mise.yml -R FNNDSC/chrisproject.org
# Publishing is idempotent: versions already on npm are skipped.
name: Publish mise

on:
  workflow_dispatch:
    inputs:
      ref:
        description: The mise ref to publish
        default: main

concurrency: publish-mise

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          repository: HARBOR-Medical-AI/mise
          ref: ${{ inputs.ref }}
          # The whole history: a release's date in dist/notes.json is the day
          # its Version Packages merge landed (scripts/notes-build.mjs).
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # The exact npm mise's CI and lockfile use; 11.5+ does the OIDC exchange.
      - run: npm install -g npm@11.19.0
      - run: npm ci
      - run: npm run build
      - name: Publish what npm does not have yet
        run: npx changeset publish
        env:
          NPM_CONFIG_PROVENANCE: 'false'
          NPM_CONFIG_LOGLEVEL: verbose
